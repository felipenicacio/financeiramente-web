name: Import C1.1 visual assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-c1-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download final C1.1 assets
