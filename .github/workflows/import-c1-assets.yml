        run: |
          set -euo pipefail
          mkdir -p public/econominho/lessons/c1/m01
          curl -L --fail --retry 3 "$L01P1" -o public/econominho/lessons/c1/m01/l01-p1.png
          curl -L --fail --retry 3 "$L01P2" -o public/econominho/lessons/c1/m01/l01-p2.png
          curl -L --fail --retry 3 "$L01P3" -o public/econominho/lessons/c1/m01/l01-p3.png
          curl -L --fail --retry 3 "$L02P1" -o public/econominho/lessons/c1/m01/l02-p1.png
          curl -L --fail --retry 3 "$L02P2" -o public/econominho/lessons/c1/m01/l02-p2.png
          curl -L --fail --retry 3 "$L02P3" -o public/econominho/lessons/c1/m01/l02-p3.png
          curl -L --fail --retry 3 "$L03P1" -o public/econominho/lessons/c1/m01/l03-p1.png
          curl -L --fail --retry 3 "$L04COIN" -o public/econominho/lessons/c1/m01/l04-coin.png
          curl -L --fail --retry 3 "$L04NOTE" -o public/econominho/lessons/c1/m01/l04-banknote.png
          curl -L --fail --retry 3 "$L04COINS" -o public/econominho/lessons/c1/m01/l04-coins.png
          curl -L --fail --retry 3 "$L05MAIN" -o public/econominho/lessons/c1/m01/l05-main.png

      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/econominho/lessons/c1/m01
          git commit -m "chore(visual): importar assets finais do C1.1"
          git push origin HEAD:main
