name: Format repaired content
on:
  push:
    paths:
      - '.github/workflows/format-repair.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write content/c2/m03/lessons/l02.json content/c2/m03/lessons/l04.json tests/content.test.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/c2/m03/lessons/l02.json content/c2/m03/lessons/l04.json tests/content.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format corrected lessons and regression tests"
            git push
          fi
