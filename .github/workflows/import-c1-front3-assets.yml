      - name: Patch C1.1 content to raster assets
        shell: python
        run: |
          from pathlib import Path
          import json

          illustration = Path("components/illustrations/Illustration.tsx")
          text = illustration.read_text()
          start = text.index("const rasterIllustrations = {")
          end = text.index("} as const;", start) + len("} as const;")
          mapping = """const rasterIllustrations = {
            'c1-m01-l01-p1': '/econominho/lessons/c1/m01/l01-p1.png',
            'c1-m01-l01-p2': '/econominho/lessons/c1/m01/l01-p2.png',
            'c1-m01-l01-p3': '/econominho/lessons/c1/m01/l01-p3.png',
            'c1-m01-l02-p1': '/econominho/lessons/c1/m01/l02-p1.png',
            'c1-m01-l02-p2': '/econominho/lessons/c1/m01/l02-p2.png',
            'c1-m01-l02-p3': '/econominho/lessons/c1/m01/l02-p3.png',
            'c1-m01-l03-p1': '/econominho/lessons/c1/m01/l03-p1.png',
            'c1-m01-l04-coin': '/econominho/lessons/c1/m01/l04-coin.png',
            'c1-m01-l04-banknote': '/econominho/lessons/c1/m01/l04-banknote.png',
            'c1-m01-l04-coins': '/econominho/lessons/c1/m01/l04-coins.png',
            'c1-m01-l05-main': '/econominho/lessons/c1/m01/l05-main.png',
            'c1-m01-l05-bread': '/econominho/lessons/c1/m01/l05-bread.png',
            'c1-m01-l05-haircut': '/econominho/lessons/c1/m01/l05-haircut.png',
            'c1-m01-l05-book': '/econominho/lessons/c1/m01/l05-book.png',
            'c1-m01-l05-repair': '/econominho/lessons/c1/m01/l05-repair.png',
          } as const;"""
          illustration.write_text(text[:start] + mapping + text[end:])

          def replace(path, pairs):
              p = Path(path)
              data = p.read_text()
              for old, new in pairs:
                  data = data.replace(old, new)
              p.write_text(data)

          replace("content/c1/m01/lessons/l03.json", [
              ('"c1-money-facilitates"', '"c1-m01-l03-p1"'),
              ('"c1-barter-problem"', '"c1-m01-l02-p3"'),
          ])
          replace("content/c1/m01/lessons/l04.json", [
              ('"item-coin-modern"', '"c1-m01-l04-coin"'),
              ('"item-banknote-modern"', '"c1-m01-l04-banknote"'),
              ('"item-coins-modern"', '"c1-m01-l04-coins"'),
          ])
          replace("content/c1/m01/lessons/l05.json", [
              ('"c1-goods-services"', '"c1-m01-l05-main"'),
              ('"item-bread"', '"c1-m01-l05-bread"'),
              ('"item-chair"', '"c1-m01-l05-haircut"'),
              ('"item-book"', '"c1-m01-l05-book"'),
              ('"item-toy-repair"', '"c1-m01-l05-repair"'),
          ])

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/econominho/lessons/c1/m01 components/illustrations/Illustration.tsx content/c1/m01/lessons
          git commit -m "chore(visual): concluir Frente 3 do C1.1 com assets Econominho"
          git push origin HEAD:main
