name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      # Garante que a saída é um site estático completo, pronto para o Cloudflare Pages.
      - name: Verifica a saída estática
        run: |
          for f in index.html idade/index.html jornadas/c1/index.html modulos/c1/m01/index.html \
                   aprender/c1/m01/l01/index.html aprender/c1/m04/fechamento/index.html \
                   modulos/c1/m02/index.html modulos/c1/m03/index.html modulos/c1/m04/index.html \
                   jornadas/c1/o-que-descobrimos/index.html \
                   manifest.webmanifest sw.js robots.txt sitemap.xml _headers 404.html; do
            test -f "out/$f" || { echo "faltando: out/$f"; exit 1; }
          done
