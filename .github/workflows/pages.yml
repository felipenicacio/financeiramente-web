name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  GITHUB_PAGES: 'true'
  NEXT_PUBLIC_BASE_PATH: '/financeiramente-web'
  NEXT_PUBLIC_SITE_URL: 'https://felipenicacio.github.io/financeiramente-web'

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Verify static output
        run: |
          test -f out/index.html
          test -f out/jornadas/c1/index.html
          test -f out/jornadas/c1/o-que-descobrimos/index.html
          test -f out/sw.js
          test -f out/manifest.webmanifest

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
